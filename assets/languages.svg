<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 72" width="100%" height="72">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#090B10"/>
    </linearGradient>
    <style>
      .mono-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace; font-size: 11px; }
      .ui-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.5px; font-weight: 500; fill: #E6EDF3; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="1" y="1" width="848" height="70" rx="10" fill="url(#barBg)" stroke="#262C36" stroke-width="1.2"/>

  <!-- Top Legend Header -->
  <g transform="translate(24, 22)">
    <circle cx="4" cy="4" r="4" fill="#38BDF8"/>
    <text x="14" y="8" class="ui-lbl">Dart / Flutter <tspan fill="#6E7681" class="mono-label">68.4%</tspan></text>

    <circle cx="210" cy="4" r="4" fill="#F59E0B"/>
    <text x="220" y="8" class="ui-lbl">JavaScript <tspan fill="#6E7681" class="mono-label">22.1%</tspan></text>

    <circle cx="370" cy="4" r="4" fill="#10B981"/>
    <text x="380" y="8" class="ui-lbl">Python <tspan fill="#6E7681" class="mono-label">9.5%</tspan></text>
    
    <text x="730" y="8" fill="#6E7681" class="mono-label" font-size="10.5">CODEBASE RATIO</text>
  </g>

  <!-- Progress Bar Container -->
  <rect x="24" y="42" width="802" height="10" rx="5" fill="#161B22"/>
  
  <!-- Segments -->
  <rect x="24" y="42" width="548" height="10" rx="5" fill="#38BDF8"/>
  <rect x="574" y="42" width="177" height="10" rx="3" fill="#F59E0B"/>
  <rect x="753" y="42" width="73" height="10" rx="5" fill="#10B981"/>
</svg>
