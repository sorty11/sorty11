<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="230">
  <defs>
    <!-- Warm Analog & Rust Gradients -->
    <linearGradient id="retroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181513"/>
      <stop offset="50%" stop-color="#211C18"/>
      <stop offset="100%" stop-color="#14110F"/>
    </linearGradient>

    <linearGradient id="rustAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="copperBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#543319"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- CRT & Warm Glow Filters -->
    <filter id="warmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .retro-mono { font-family: 'Courier New', Courier, 'Fira Code', monospace; }
      @keyframes amberFlicker {
        0%, 100% { opacity: 0.96; }
        50% { opacity: 0.88; }
        70% { opacity: 0.98; }
      }
      @keyframes scanlineCRT {
        0% { transform: translateY(0px); }
        100% { transform: translateY(230px); }
      }
      .crt-flicker { animation: amberFlicker 4s infinite ease-in-out; }
      .crt-line {
        animation: scanlineCRT 6s linear infinite;
        opacity: 0.07;
      }
      @keyframes blinkCursor { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
      .cursor-amber { animation: blinkCursor 1.2s infinite; }
    </style>
  </defs>

  <!-- Heavy Card Chassis with Copper/Rust Border -->
  <rect x="2" y="2" width="846" height="226" rx="10" fill="url(#retroBg)" stroke="url(#copperBorder)" stroke-width="1.8"/>

  <!-- Vintage Screws in corners -->
  <circle cx="16" cy="16" r="3.5" fill="#3D2B1F" stroke="#78350F" stroke-width="1"/>
  <line x1="14" y1="14" x2="18" y2="18" stroke="#78350F" stroke-width="0.8"/>
  <circle cx="834" cy="16" r="3.5" fill="#3D2B1F" stroke="#78350F" stroke-width="1"/>
  <line x1="832" y1="14" x2="836" y2="18" stroke="#78350F" stroke-width="0.8"/>
  <circle cx="16" cy="214" r="3.5" fill="#3D2B1F" stroke="#78350F" stroke-width="1"/>
  <line x1="14" y1="212" x2="18" y2="216" stroke="#78350F" stroke-width="0.8"/>
  <circle cx="834" cy="214" r="3.5" fill="#3D2B1F" stroke="#78350F" stroke-width="1"/>
  <line x1="832" y1="212" x2="836" y2="216" stroke="#78350F" stroke-width="0.8"/>

  <!-- Subtle CRT Scanlines -->
  <g opacity="0.04" stroke="#D97706" stroke-width="1">
    <line x1="10" y1="35" x2="840" y2="35"/>
    <line x1="10" y1="70" x2="840" y2="70"/>
    <line x1="10" y1="105" x2="840" y2="105"/>
    <line x1="10" y1="140" x2="840" y2="140"/>
    <line x1="10" y1="175" x2="840" y2="175"/>
    <line x1="10" y1="210" x2="840" y2="210"/>
  </g>

  <!-- Rolling Scanline Bar -->
  <line class="crt-line" x1="10" y1="0" x2="840" y2="0" stroke="#F59E0B" stroke-width="3"/>

  <!-- Top Terminal Bar -->
  <rect x="25" y="22" width="800" height="28" rx="4" fill="#14110E" stroke="#442D1C" stroke-width="1"/>
  <text x="38" y="41" fill="#A87345" class="retro-mono" font-size="11" font-weight="700" letter-spacing="1">WORKBENCH_V1.0 // STATION ID: SORTY-01</text>
  <text x="690" y="41" fill="#D97706" class="retro-mono" font-size="11" font-weight="600">[AMBER_CRT]</text>
  <circle cx="674" cy="37" r="3.5" fill="#D97706"/>

  <!-- Hero Content -->
  <g class="crt-flicker">
    <!-- Main Name -->
    <text x="45" y="105" fill="url(#rustAmber)" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="900" letter-spacing="3" filter="url(#warmGlow)">SORTY</text>
    <text x="210" y="92" fill="#9A3412" class="retro-mono" font-size="13" font-weight="700">[EST. 2024]</text>

    <!-- Warm Tagline -->
    <text x="48" y="136" fill="#F3E9DC" class="retro-mono" font-size="14" font-weight="600" letter-spacing="0.8">BUILDING HANDCRAFTED SOFTWARE &amp; DIGITAL EXPERIMENTS</text>
    <text x="48" y="160" fill="#A88B74" class="retro-mono" font-size="12">tinkering with flutter, backends, &amp; practical tools for everyday use <tspan class="cursor-amber" fill="#D97706">_</tspan></text>
  </g>

  <!-- Right Side Analog Gauges / Hardware Pills -->
  <g transform="translate(560, 68)">
    <rect x="0" y="0" width="245" height="42" rx="6" fill="#171310" stroke="#5E3B20" stroke-width="1"/>
    <text x="14" y="17" fill="#8C684B" class="retro-mono" font-size="9" font-weight="700">PRIMARY CRAFT</text>
    <text x="14" y="32" fill="#D97706" class="retro-mono" font-size="12" font-weight="700">📱 Mobile &amp; App Architecture</text>

    <rect x="0" y="48" width="245" height="42" rx="6" fill="#171310" stroke="#5E3B20" stroke-width="1"/>
    <text x="14" y="65" fill="#8C684B" class="retro-mono" font-size="9" font-weight="700">ACTIVE PROJECT</text>
    <text x="14" y="80" fill="#E76F51" class="retro-mono" font-size="12" font-weight="700">⚡ Schedly (Campus Alerts)</text>

    <rect x="0" y="96" width="245" height="42" rx="6" fill="#171310" stroke="#5E3B20" stroke-width="1"/>
    <text x="14" y="113" fill="#8C684B" class="retro-mono" font-size="9" font-weight="700">WORKSHOP STATUS</text>
    <text x="14" y="128" fill="#F4A261" class="retro-mono" font-size="12" font-weight="700">🛠️ Building &amp; Shipping</text>
  </g>

  <!-- Bottom Accent Ruler line with tick marks -->
  <line x1="30" y1="195" x2="520" y2="195" stroke="#442D1C" stroke-width="1"/>
  <line x1="30" y1="192" x2="30" y2="198" stroke="#D97706" stroke-width="1"/>
  <line x1="150" y1="193" x2="150" y2="197" stroke="#8C684B" stroke-width="1"/>
  <line x1="270" y1="193" x2="270" y2="197" stroke="#8C684B" stroke-width="1"/>
  <line x1="390" y1="193" x2="390" y2="197" stroke="#8C684B" stroke-width="1"/>
  <line x1="520" y1="192" x2="520" y2="198" stroke="#D97706" stroke-width="1"/>
  <text x="48" y="210" fill="#6B4F39" class="retro-mono" font-size="10">ANALOG FIDELITY • CRAFT OVER HYPE • PROTOTYPE → PRODUCT</text>
</svg>
