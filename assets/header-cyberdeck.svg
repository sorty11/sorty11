<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="50%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055"/>
      <stop offset="100%" stop-color="#FF5577"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.6; }
        100% { transform: translateY(240px); opacity: 0.1; }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }
      @keyframes eqBar1 { 0%, 100% { height: 8px; } 50% { height: 28px; } }
      @keyframes eqBar2 { 0%, 100% { height: 24px; } 50% { height: 10px; } }
      @keyframes eqBar3 { 0%, 100% { height: 14px; } 50% { height: 32px; } }
      @keyframes eqBar4 { 0%, 100% { height: 30px; } 50% { height: 12px; } }
      @keyframes eqBar5 { 0%, 100% { height: 10px; } 50% { height: 26px; } }
      @keyframes blinkCursor { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

      .scanner { animation: scanline 4s linear infinite; }
      .pulser { animation: pulseLight 3s ease-in-out infinite; }
      .b1 { animation: eqBar1 0.9s ease-in-out infinite; }
      .b2 { animation: eqBar2 0.7s ease-in-out infinite; }
      .b3 { animation: eqBar3 1.1s ease-in-out infinite; }
      .b4 { animation: eqBar4 0.8s ease-in-out infinite; }
      .b5 { animation: eqBar5 1.0s ease-in-out infinite; }
      .cursor { animation: blinkCursor 1s infinite; }
      .mono-text { font-family: 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="846" height="256" rx="14" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="1.5"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.08" stroke="#00F2FE" stroke-width="0.75">
    <line x1="40" y1="0" x2="40" y2="260"/>
    <line x1="120" y1="0" x2="120" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="280" y1="0" x2="280" y2="260"/>
    <line x1="360" y1="0" x2="360" y2="260"/>
    <line x1="440" y1="0" x2="440" y2="260"/>
    <line x1="520" y1="0" x2="520" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
    <line x1="680" y1="0" x2="680" y2="260"/>
    <line x1="760" y1="0" x2="760" y2="260"/>
    <line x1="0" y1="50" x2="850" y2="50"/>
    <line x1="0" y1="100" x2="850" y2="100"/>
    <line x1="0" y1="150" x2="850" y2="150"/>
    <line x1="0" y1="200" x2="850" y2="200"/>
  </g>

  <!-- Scanning Laser Bar -->
  <rect class="scanner" x="20" y="10" width="810" height="2" fill="url(#laserGrad)"/>

  <!-- Top Terminal Header Bar -->
  <rect x="2" y="2" width="846" height="38" rx="12" fill="#0E1626" opacity="0.85"/>
  <circle cx="25" cy="20" r="5" fill="#FF5F56"/>
  <circle cx="42" cy="20" r="5" fill="#FFBD2E"/>
  <circle cx="59" cy="20" r="5" fill="#27C93F"/>
  <text x="85" y="24" fill="#6B7D9E" class="mono-text" font-size="12" font-weight="600" letter-spacing="1.5">SYS://KERNEL_V2.6 // TARGET: SORTY11.SYS</text>
  <text x="730" y="24" fill="#00F2FE" class="mono-text" font-size="11" font-weight="700">[ONLINE]</text>
  <circle cx="798" cy="20" r="4" fill="#00FF66" class="pulser"/>

  <!-- Cyber Chamfer Accents -->
  <path d="M 12 60 L 12 45 L 27 45" fill="none" stroke="#00F2FE" stroke-width="2" opacity="0.7"/>
  <path d="M 838 60 L 838 45 L 823 45" fill="none" stroke="#00F2FE" stroke-width="2" opacity="0.7"/>
  <path d="M 12 215 L 12 230 L 27 230" fill="none" stroke="#FF0055" stroke-width="2" opacity="0.7"/>
  <path d="M 838 215 L 838 230 L 823 230" fill="none" stroke="#FF0055" stroke-width="2" opacity="0.7"/>

  <!-- Main Hero Title -->
  <text x="45" y="112" fill="url(#neonCyan)" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" letter-spacing="4" filter="url(#glowCyan)">SORTY</text>
  <text x="245" y="102" fill="#FF0055" font-family="'Fira Code', monospace" font-size="16" font-weight="800" filter="url(#glowPink)">// 0xBUILDER</text>

  <!-- Tagline / Subtitle -->
  <text x="48" y="142" fill="#E2E8F0" class="mono-text" font-size="14" font-weight="600" letter-spacing="1">AI-NATIVE SYSTEMS BUILDER <tspan fill="#00F2FE">•</tspan> RAPID PRODUCT PROTOTYPER</text>
  <text x="48" y="165" fill="#8899B5" class="mono-text" font-size="12">Turn vibes &amp; prompts into high-performance production software <tspan class="cursor" fill="#00F2FE">█</tspan></text>

  <!-- Equalizer Audio Visualizer (Bottom Left) -->
  <g transform="translate(48, 195)">
    <rect class="b1" x="0" y="0" width="4" height="15" rx="2" fill="#00F2FE" transform="scale(1, -1)"/>
    <rect class="b2" x="7" y="0" width="4" height="20" rx="2" fill="#00F2FE" transform="scale(1, -1)"/>
    <rect class="b3" x="14" y="0" width="4" height="28" rx="2" fill="#00F2FE" transform="scale(1, -1)"/>
    <rect class="b4" x="21" y="0" width="4" height="18" rx="2" fill="#FF0055" transform="scale(1, -1)"/>
    <rect class="b5" x="28" y="0" width="4" height="12" rx="2" fill="#FF0055" transform="scale(1, -1)"/>
    <rect class="b1" x="35" y="0" width="4" height="25" rx="2" fill="#00F2FE" transform="scale(1, -1)"/>
    <rect class="b3" x="42" y="0" width="4" height="16" rx="2" fill="#00F2FE" transform="scale(1, -1)"/>
    <rect class="b2" x="49" y="0" width="4" height="22" rx="2" fill="#00FF66" transform="scale(1, -1)"/>
    <text x="65" y="-6" fill="#6B7D9E" class="mono-text" font-size="11" font-weight="600">NEURAL SYNTH FREQ: 44.1 kHz</text>
  </g>

  <!-- Right Side Stat Pods -->
  <g transform="translate(560, 65)">
    <!-- Pod 1 -->
    <rect x="0" y="0" width="245" height="42" rx="8" fill="#0D1626" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1"/>
    <text x="14" y="17" fill="#6B7D9E" class="mono-text" font-size="9" font-weight="700">ACTIVE FLAGSHIP</text>
    <text x="14" y="32" fill="#00F2FE" class="mono-text" font-size="12" font-weight="700">📱 Schedly (Flutter + FCM)</text>

    <!-- Pod 2 -->
    <rect x="0" y="50" width="245" height="42" rx="8" fill="#0D1626" stroke="#FF0055" stroke-opacity="0.3" stroke-width="1"/>
    <text x="14" y="67" fill="#6B7D9E" class="mono-text" font-size="9" font-weight="700">PRIMARY ARCHITECTURE</text>
    <text x="14" y="82" fill="#FF5577" class="mono-text" font-size="12" font-weight="700">⚡ Transactional Outbox</text>

    <!-- Pod 3 -->
    <rect x="0" y="100" width="245" height="42" rx="8" fill="#0D1626" stroke="#00FF66" stroke-opacity="0.3" stroke-width="1"/>
    <text x="14" y="117" fill="#6B7D9E" class="mono-text" font-size="9" font-weight="700">EXECUTION VELOCITY</text>
    <text x="14" y="132" fill="#00FF66" class="mono-text" font-size="12" font-weight="700">🚀 100% Vibe-Coded Deploy</text>
  </g>

  <!-- Bottom Cyber Divider -->
  <line x1="20" y1="240" x2="830" y2="240" stroke="#1F293D" stroke-width="1"/>
</svg>
