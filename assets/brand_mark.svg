<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="54" height="54">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Dark Octagonal Outer Chassis -->
  <rect x="2" y="2" width="68" height="68" rx="16" fill="#0B0E14" stroke="#262C36" stroke-width="1.2"/>
  
  <!-- Subtle Internal Grid Cross -->
  <line x1="36" y1="12" x2="36" y2="60" stroke="#1B2230" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="12" y1="36" x2="60" y2="36" stroke="#1B2230" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Engineered S11 Monogram -->
  <!-- Upper Curve of S -->
  <path d="M 44 22 L 28 22 C 22 22 18 26 18 31 C 18 36 22 38 28 39 L 44 41 C 50 42 54 44 54 49 C 54 55 49 58 42 58 L 26 58" fill="none" stroke="url(#markGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Twin Vertical 11 Accent Bars -->
  <line x1="34" y1="28" x2="34" y2="34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="38" y1="46" x2="38" y2="52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Corner Precision Ticks -->
  <circle cx="8" cy="8" r="1.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="64" cy="8" r="1.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="8" cy="64" r="1.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="64" cy="64" r="1.5" fill="#38BDF8" opacity="0.6"/>
</svg>
