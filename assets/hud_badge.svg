<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" width="100%" height="90">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#070A10" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0D1321" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070A10" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>

    <style>
      .badge-mono { font-family: 'Fira Code', 'Courier New', monospace; }
      @keyframes blinkCursor { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
      .cursor { animation: blinkCursor 1s infinite; }
    </style>
  </defs>

  <!-- Frame with Chamfer and Border -->
  <rect x="2" y="2" width="846" height="86" rx="8" fill="url(#badgeBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Tactical Corner Brackets -->
  <path d="M 8 20 L 8 8 L 20 8" fill="none" stroke="#00F2FE" stroke-width="2"/>
  <path d="M 842 20 L 842 8 L 830 8" fill="none" stroke="#8A2BE2" stroke-width="2"/>
  <path d="M 8 70 L 8 82 L 20 82" fill="none" stroke="#00F2FE" stroke-width="2"/>
  <path d="M 842 70 L 842 82 L 830 82" fill="none" stroke="#8A2BE2" stroke-width="2"/>

  <!-- Identity Node -->
  <text x="32" y="38" fill="url(#cyanPurple)" class="badge-mono" font-size="20" font-weight="900" letter-spacing="2">[S11] // SORTY</text>
  <text x="210" y="37" fill="#64748B" class="badge-mono" font-size="12" font-weight="600">| B.TECH COMPUTER ENGINEERING • MOBILE ARCHITECT • HACKATHON BUILDER</text>

  <!-- Dynamic Mission Statement -->
  <text x="34" y="66" fill="#00F2FE" class="badge-mono" font-size="12" font-weight="700">&gt; CURRENT_OPS:</text>
  <text x="145" y="66" fill="#CBD5E1" class="badge-mono" font-size="12">Scaling Schedly FCM Outbox • SIH Project Fateheen • Vision AirControl <tspan class="cursor" fill="#00F2FE">█</tspan></text>

  <!-- Right Status Pill -->
  <rect x="735" y="16" width="90" height="24" rx="4" fill="#0F172A" stroke="#00F2FE" stroke-width="1"/>
  <circle cx="748" cy="28" r="3.5" fill="#00FF66"/>
  <text x="758" y="32" fill="#00F2FE" class="badge-mono" font-size="10" font-weight="700">ARMED</text>
</svg>
